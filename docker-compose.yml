services:
  db:
    image: postgres:15-alpine
    container_name: moex_db
    restart: always
    environment:
      POSTGRES_DB: moex_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - moex_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d moex_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cache:
    image: redis:7-alpine
    container_name: moex_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - moex_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moex_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres_user
      - DB_PASSWORD=postgres_password
      - DB_NAME=moex_db
      - REDIS_HOST=cache    
      - REDIS_PORT=6379       
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - moex_network

  collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moex_collector
    restart: always
    command: sh -c "python scripts/wait_for_services.py && python collector/moex_collector.py"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres_user
      - DB_PASSWORD=postgres_password
      - DB_NAME=moex_db
      - REDIS_HOST=cache    
      - REDIS_PORT=6379      
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - moex_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moex_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - moex_network

volumes:
  postgres_data:
  redis_data:

networks:
  moex_network:
    driver: bridge